<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Source Han Sans SC','Inter',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="96" y="104" font-size="40" font-weight="700" fill="#111111">写它的那颗脑子，看不见它的漏洞</text>
  <text x="96" y="146" font-size="20" fill="#666666">同上下文自审会替自己辩护 · 换新视角才挑得出盲点</text>

  <!-- left: same-context self-review -->
  <text x="330" y="250" font-size="24" font-weight="700" fill="#999999" text-anchor="middle">同上下文自审</text>
  <circle cx="330" cy="400" r="120" fill="none" stroke="#B8B8B8" stroke-width="1.5"/>
  <text x="330" y="392" font-size="20" fill="#666666" text-anchor="middle">作者 = 审稿人</text>
  <text x="330" y="424" font-size="18" fill="#999999" text-anchor="middle">收敛回原本的相信</text>
  <!-- blind spot dot inside, uncaught -->
  <circle cx="400" cy="340" r="8" fill="#B8B8B8"/>
  <text x="330" y="560" font-size="17" fill="#999999" text-anchor="middle">盲点藏在圈里 · 挑不出来</text>

  <!-- right: fresh eyes -->
  <text x="870" y="250" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">换新视角 / 独立批评者</text>
  <circle cx="820" cy="400" r="120" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="820" y="392" font-size="20" fill="#111111" text-anchor="middle">只看成品 + 原始要求</text>
  <text x="820" y="424" font-size="18" fill="#666666" text-anchor="middle">不看你的思考过程</text>
  <!-- blind spot caught: blue dot outside pointing in -->
  <circle cx="890" cy="340" r="8" fill="#B8B8B8"/>
  <circle cx="1010" cy="300" r="9" fill="#2F6BFF"/>
  <line x1="1002" y1="306" x2="898" y2="337" stroke="#2F6BFF" stroke-width="1.5"/>
  <text x="820" y="560" font-size="17" fill="#666666" text-anchor="middle">同一个盲点 · 被一眼指出</text>

  <text x="600" y="636" font-size="18" fill="#999999" text-anchor="middle">新上下文的批评者，是最便宜的"诚实"来源</text>
</svg>
