<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'PingFang SC','Source Han Sans SC','Inter',sans-serif">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#111111" stroke-width="2"/>
  <text x="80" y="46" font-size="20" fill="#666666" letter-spacing="4">为什么"再检查一遍"没用</text>

  <!-- left: same brain -->
  <text x="120" y="200" font-size="88" font-weight="800" fill="#B8B8B8">同一颗脑子</text>
  <text x="120" y="270" font-size="30" font-weight="700" fill="#999999">= 走过场</text>
  <text x="120" y="330" font-size="24" fill="#999999">让缺陷藏起来的那个盲点，</text>
  <text x="120" y="366" font-size="24" fill="#999999">正是当初造成缺陷的那个盲点。</text>
  <text x="120" y="424" font-size="24" fill="#999999">它只会一路点头：嗯，挺好。</text>

  <!-- divider -->
  <line x1="600" y1="110" x2="600" y2="470" stroke="#111111" stroke-width="2"/>

  <!-- right: fresh eyes -->
  <text x="660" y="200" font-size="88" font-weight="800" fill="#111111">换个视角</text>
  <text x="660" y="270" font-size="30" font-weight="700" fill="#2F6BFF">= 挑得出毛病</text>
  <text x="660" y="330" font-size="24" fill="#666666">你现在不是作者，是审稿人。</text>
  <text x="660" y="366" font-size="24" fill="#666666">只拿到成品和原始要求，</text>
  <text x="660" y="424" font-size="24" fill="#666666">任务是证明它<tspan font-weight="700" fill="#111111">不该被交付</tspan>。</text>

  <line x1="80" y1="510" x2="1120" y2="510" stroke="#111111" stroke-width="2"/>
  <text x="1120" y="542" font-size="22" font-weight="700" fill="#111111" text-anchor="end">新上下文挑刺最狠，也最诚实</text>
</svg>
