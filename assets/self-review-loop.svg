<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'PingFang SC','Source Han Sans SC','Inter',sans-serif">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#111111" stroke-width="2"/>
  <text x="80" y="46" font-size="20" fill="#666666" letter-spacing="4">它跑起来是什么样</text>

  <!-- big steps -->
  <text x="80" y="210" font-size="72" font-weight="800" fill="#111111">换视角</text>
  <text x="410" y="210" font-size="64" font-weight="300" fill="#2F6BFF">→</text>
  <text x="490" y="210" font-size="72" font-weight="800" fill="#111111">挑刺列清单</text>
  <text x="960" y="210" font-size="64" font-weight="300" fill="#2F6BFF">→</text>
  <text x="1040" y="210" font-size="72" font-weight="800" fill="#111111">修正</text>

  <!-- loop note -->
  <text x="80" y="285" font-size="28" fill="#666666">这个循环最多跑</text>
  <text x="352" y="285" font-size="28" font-weight="800" fill="#2F6BFF">三轮</text>
  <text x="448" y="285" font-size="28" fill="#666666">。</text>

  <line x1="80" y1="330" x2="1120" y2="330" stroke="#E8E8E8" stroke-width="1.5"/>

  <!-- honesty punchline -->
  <text x="80" y="420" font-size="60" font-weight="800" fill="#111111">三轮还没干净？</text>
  <text x="80" y="478" font-size="34" font-weight="700" fill="#2F6BFF">它不装完美，直接把剩下的问题摊给你。</text>

  <line x1="80" y1="502" x2="1120" y2="502" stroke="#111111" stroke-width="2"/>
</svg>
