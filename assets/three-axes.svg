<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'PingFang SC','Source Han Sans SC','Inter',sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#111111" stroke-width="2"/>
  <text x="80" y="46" font-size="20" fill="#666666" letter-spacing="4">交付前 · 必过三关</text>

  <!-- 一省 -->
  <text x="80" y="196" font-size="120" font-weight="800" fill="#111111">一省</text>
  <text x="360" y="150" font-size="52" font-weight="800" fill="#2F6BFF">可信</text>
  <text x="360" y="200" font-size="26" fill="#666666">有没有编的？每个数字、名字、结论，说得出从哪来吗</text>
  <line x1="80" y1="230" x2="1120" y2="230" stroke="#E8E8E8" stroke-width="1.5"/>

  <!-- 二省 -->
  <text x="80" y="366" font-size="120" font-weight="800" fill="#111111">二省</text>
  <text x="360" y="320" font-size="52" font-weight="800" fill="#2F6BFF">完整</text>
  <text x="360" y="370" font-size="26" fill="#666666">你要的每件都做了吗？"做 A 顺便 B"最爱漏掉 B</text>
  <line x1="80" y1="400" x2="1120" y2="400" stroke="#E8E8E8" stroke-width="1.5"/>

  <!-- 三省 -->
  <text x="80" y="536" font-size="120" font-weight="800" fill="#111111">三省</text>
  <text x="360" y="490" font-size="52" font-weight="800" fill="#2F6BFF">合意</text>
  <text x="360" y="540" font-size="26" fill="#666666">答的是你真想要的吗？还是在精准回答一个错的问题</text>

  <line x1="80" y1="575" x2="1120" y2="575" stroke="#111111" stroke-width="2"/>
  <text x="1120" y="605" font-size="22" font-weight="700" fill="#111111" text-anchor="end">三关同时过 · 才算真做完</text>
</svg>
