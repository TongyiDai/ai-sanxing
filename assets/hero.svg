<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="'PingFang SC','Source Han Sans SC','Inter',sans-serif">
  <rect width="1200" height="440" fill="#FFFFFF"/>

  <!-- top rule -->
  <line x1="80" y1="70" x2="1120" y2="70" stroke="#111111" stroke-width="2"/>
  <text x="80" y="56" font-size="18" fill="#666666" letter-spacing="6">AI · 三 · 省 · 吾 · 身</text>
  <text x="1120" y="56" font-size="18" fill="#999999" text-anchor="end">AGENT SELF-REVIEW SKILL</text>

  <!-- big characters -->
  <text x="600" y="240" font-size="150" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="20">三省 AI 身</text>

  <!-- accent underline -->
